services:
  web:
    container_name: shop_django
    build:
      context: .
    command: sh /app/entrypoint.sh
    expose:
      - 8000
    env_file: .env
    volumes:
      - .:/app
      - back_media:/app/media
      - back_static:/app/static
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:14
    container_name: shop_postgres
    environment:
      - POSTGRES_NAME=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}  
    volumes:
      - db-data:/var/lib/postgresql/data

  redis:
    image: redis:8
    container_name: shop_redis
    volumes:
      - redis-data:/data

  celery_worker:
    container_name: shop_worker
    build:
      context: .
    command: celery -A shop_api worker --loglevel=DEBUG
    depends_on:
      - redis
      - postgres
    env_file:
      .env
    volumes:
      - .:/app

  celery_beat:
    container_name: shop_beat
    build:
      context: .
    command: celery -A shop_api beat --loglevel=DEBUG
    depends_on:
      - redis
      - postgres
    env_file:
      .env
    volumes:
      - .:/app

  celery_flower:
    container_name: shop_flower
    build:
      context: .
    command: celery -A shop_api flower --port=5555
    ports:
      - "5556:5555"
    depends_on:
      - redis
    env_file:
      .env
    volumes:
      - .:/app

  nginx:
    container_name: shop_nginx
    image: nginx:1
    ports:
      - "80:80"
    depends_on:
      - web
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - back_media:/app/media
      - back_static:/app/static

volumes:
  db-data:
  redis-data:
  back_media:
  back_static:
